            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationEventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/processes:
    parameters:
      - $ref: '#/components/parameters/VMId'
    get:
      operationId: listProcesses
      tags: [processes]
      summary: List davit-managed processes in this VM.
      description: |
        Every recorded process of this VM, oldest first in stable
        `(createdAt, id)` order with an opaque cursor, like every list. A start
        interrupted by a daemon crash is reported `lost` (never re-run). Requires
        a guest transport (`422 unsupported_capability` otherwise).
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of processes.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProcessList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: execProcess
      tags: [processes]
      summary: Start a process in the VM.
      description: |
        Returns the process resource; attach to output separately via
        `attachProcess`. Repeating with a new `Idempotency-Key` executes again;
        repeating with the same key and body returns the same process (a
        different body is `409 idempotency_conflict`). The VM must be `ready`
        or `running` (`409 invalid_state`). A process that is not `detached`
        is killed when its first attached stream closes before it exits, or
        when no stream attaches within 60 seconds; `detached` processes
        survive and can be re-attached. `tty` is not supported
        (`422 unsupported_capability`).
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecRequest'}
      responses:
        '201':
          description: The started process.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Process'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/processes/{processId}:
    parameters:
      - $ref: '#/components/parameters/VMId'
      - $ref: '#/components/parameters/ProcessId'
    get:
      operationId: getProcess
      tags: [processes]
      summary: Get one process.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The process.
