        '500': {$ref: '#/components/responses/Internal'}

  /webhooks/{webhookId}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      operationId: rotateWebhookSecret
      tags: [webhooks]
      summary: "Replace the signing secret; the old one keeps signing for an overlap window."
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RotateWebhookSecretRequest'}
      responses:
        '200':
          description: The webhook and its new signing secret.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSecret'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

  /webhooks/{webhookId}/deliveries:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: "List a webhook's deliveries, newest first."
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          schema: {type: string, enum: [pending, delivered, dead]}
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of deliveries.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDeliveryList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

  /webhooks/{webhookId}/deliveries/{deliveryId}/retry:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
      - $ref: '#/components/parameters/DeliveryId'
    post:
      operationId: retryWebhookDelivery
      tags: [webhooks]
      summary: "Deliver a dead (or delivered) delivery again, now."
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The delivery, pending again.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDelivery'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: |
        Optional random API token (hashed at rest, scoped, expiring, revocable).
        The empty security alternative (`{}`) does NOT mean anonymous access: it
        means the transport authenticated the caller directly, by tsnet
        `LocalClient.WhoIs` on the accepted peer address (remote listener) or
        by OS peer credentials (local unix socket). When both a WhoIs identity
        and a token are present their grants are intersected, never unioned.

  headers:
    X-Request-Id:
      description: Request correlation ID; echoes the client's value or is generated by the server.
      required: true
      schema:
        type: string
    Location:
      description: Path of the created operation, `/api/v1/operations/{operationId}`.
      required: true
      schema:
        type: string
    Retry-After:
      description: Seconds to wait before retrying, when meaningful.
      schema:
        type: integer
        minimum: 0

  parameters:
    VMId:
      name: vmId
      in: path
      required: true
      description: VM ID (`vm_...`) or the caller's VM name. Deleted VMs resolve by ID only.
      schema: {type: string}
    ImageId:
      name: imageId
      in: path
      required: true
      schema: {type: string}
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      description: Snapshot ID (`snap_...`) or the name of one of the caller's named snapshots.
      schema: {type: string}
    OperationId:
      name: operationId
      in: path
      required: true
      schema: {type: string}
    PromptId:
      name: promptId
      in: path
      required: true
      schema: {type: string}
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: {type: string}
    ProcessId:
      name: processId
      in: path
      required: true
      schema: {type: string}
    TunnelId:
      name: tunnelId
      in: path
      required: true
      schema: {type: string}
    MemberId:
      name: memberId
      in: path
      required: true
      description: Member ID (`mem_...`) or login.
      schema: {type: string}
    ShareId:
      name: shareId
      in: path
      required: true
      schema: {type: string}
    EndpointId:
      name: endpointId
      in: path
      required: true
      description: App endpoint ID (`app_...`) or its name within the VM.
      schema: {type: string}
    ForwardId:
      name: forwardId
      in: path
      required: true
      description: Reverse forward ID (`rev_...`).
      schema: {type: string}
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: {type: string}
    TokenId:
      name: tokenId
      in: path
      required: true
      schema: {type: string}
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema: {type: string}
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: {type: string}
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor from a previous page's `nextCursor`. It binds the
        filters, order and authorization scope of the original request.
      schema: {type: string}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-chosen key. Scope is host + principal + method + canonical path
        + key. Same key and body returns the same operation/resource; a
        different body returns `409 idempotency_conflict`. Retained at least
        24h after the terminal state. Replays are always reauthorized.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    CapacityWait:
      name: waitSeconds
      in: query
      required: false
      description: >-
        Feature capacityReclaim. When admission is refused for memory, live VMs or CPU, the host
        first stops idle VMs (an idle timeout, ready, no process, no stream or tunnel, no activity
        for `limits.reclaimIdleAfterSeconds`; oldest activity first; never ephemeral or
        no-snapshot VMs), each a stop with `reason: reclaim`. If there is still no room, the
        request waits up to this many seconds in a FIFO queue (`HostCapacity.waiting`), and
        answers once admitted, or `resource_exhausted` (details `waitedSeconds`) when the wait
        ends. While anyone waits, a request without a wait fails at once (details `resource:
        queue`, `waiting`); a resumeVM of a ready or running VM needs no room and never queues.
        Omitted or 0: no wait.
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 3600
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional idempotency key; same semantics as on create.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Expected VM `stateRevision` as a decimal integer string (e.g. `7`).
        A stale revision returns `412 revision_mismatch`.
      schema:
        type: string
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Client correlation ID; echoed in the response.
      schema:
        type: string
        maxLength: 255

    EnvironmentId:
      name: environmentId
      in: path
      required: true
      description: Environment ID (`env_...`) or name.
      schema: {type: string}
    Revision:
      name: revision
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    CredentialProfileId:
      name: profileId
      in: path
      required: true
      description: Profile ID or name.
      schema: {type: string}
    CredentialName:
      name: credentialName
      in: path
      required: true
      schema: {type: string}
    GrantId:
      name: grantId
      in: path
      required: true
      schema: {type: string}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string}
  responses:
    OperationAccepted:
      description: Accepted; the operation runs asynchronously.
      headers:
        Location: {$ref: '#/components/headers/Location'}
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/OperationAccepted'}
    BadRequest:
      description: '`invalid_argument`: malformed request.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthenticated:
      description: '`unauthenticated`: no valid identity.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PermissionDenied:
      description: '`permission_denied`: identity lacks the required grant.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: '`not_found`: absent or invisible to the caller.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: |
        `operation_in_progress` (with `operationId`), `idempotency_conflict`,
        `invalid_state` or `stop_required`.
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PreconditionFailed:
      description: '`revision_mismatch`: `If-Match` did not equal the current `stateRevision`.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    PayloadTooLarge:
      description: '`payload_too_large`: request or object exceeds a size bound.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    UnsupportedCapability:
      description: '`unsupported_capability`: unsupported shape, architecture or feature.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TooManyRequests:
      description: '`resource_exhausted`: quota or host allocation limit.'
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Internal:
      description: '`internal`: unexpected server error (message redacted).'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotImplemented:
      description: '`not_implemented`: part of the v1 contract but not implemented by this server yet.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unavailable:
      description: '`unavailable`: host or runtime temporarily unavailable.'
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Timeout:
      description: '`timeout`: the server gave up waiting on the host or guest.'
      headers:
        X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}

  schemas:
    # ---- enums -------------------------------------------------------------
    VMState:
      type: string
      description: |
        VM lifecycle state. Later versions add states (e.g. suspending,
        suspended) behind capabilities; clients MUST tolerate unknown values.
      enum: [provisioning, ready, running, stopping, stopped, error, deleting, deleted]
    OperationState:
      type: string
      enum: [queued, running, succeeded, failed]
    OperationKind:
      type: string
      enum: [create, fork, stop, resume, delete, snapshot, recover]
    BootMode:
      type: string
      description: How the instance actually started; the empty string means it has not booted.
      enum: ['', cold_boot, golden_restore, bootstrap_restore, ram_restore]
    SnapshotKind:
      type: string
      enum: [disk, ram]
    Consistency:
      type: string
      description: Whether a disk snapshot came from a clean shutdown.
      enum: [clean, crash]
    Arch:
      type: string
      enum: [amd64, arm64]
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. HTTP status mapping: 400
        invalid_argument; 401 unauthenticated; 403 permission_denied; 404
        not_found; 409 operation_in_progress, idempotency_conflict,
        invalid_state, stop_required; 412 revision_mismatch; 413
        payload_too_large; 422 unsupported_capability; 429 resource_exhausted;
        500 internal; 501 not_implemented; 503 unavailable; 504 timeout.
      enum:
        - invalid_argument
        - unauthenticated
        - permission_denied
        - not_found
        - operation_in_progress
        - idempotency_conflict
        - invalid_state
        - stop_required
        - revision_mismatch
        - payload_too_large
        - unsupported_capability
        - resource_exhausted
        - unavailable
        - not_implemented
        - timeout
        - internal

    # ---- errors ------------------------------------------------------------
    ErrorResponse:
      type: object
      description: Body of every non-2xx JSON response.
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/Error'}
    Error:
      type: object
      description: Error envelope. Secrets and host paths are redacted.
      required: [code, message, retryable, requestId]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message:
          type: string
          description: Human-readable; may change. Do not match on it.
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
        requestId:
          type: string
        operationId:
          type: string
          description: Set for `operation_in_progress` and errors tied to an operation.
    ErrorInfo:
      type: object
      description: Error recorded on an operation or VM (`Operation.error`, `VM.lastError`).
      required: [code, message, retryable]
      properties:
        code: {$ref: '#/components/schemas/ErrorCode'}
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
        operationId:
          type: string

    # ---- capabilities ------------------------------------------------------
    HostCapabilities:
      type: object
      required: [version, runtime, bootModes, storage, network, states, services, profiles, ttlWarningSeconds, features, harnesses]
      properties:
        version:
          type: string
        runtime: {$ref: '#/components/schemas/RuntimeCapabilities'}
        bootModes:
          type: array
          items: {$ref: '#/components/schemas/BootMode'}
        storage: {$ref: '#/components/schemas/StorageCapabilities'}
        network: {$ref: '#/components/schemas/NetworkCapabilities'}
        states:
          type: array
          description: VM states this host can report.
          items: {$ref: '#/components/schemas/VMState'}
        services:
          type: array
          items: {type: string}
        profiles:
          type: array
          description: Administrator-defined shapes accepted by `type` on createVM/forkVM.
          items: {$ref: '#/components/schemas/Profile'}
        ttlWarningSeconds:
          type: integer
          format: int64
          description: How long before an auto-stop the host starts warning (VM.autoStopWarningAt).
        features:
          type: array
          description: >-
            Contract surfaces and whether this host provides them. Operations of a
            `not_implemented` feature answer `not_implemented` (HTTP 501) naming the feature.
          items: {$ref: '#/components/schemas/Feature'}
        harnesses:
          type: array
          items: {$ref: '#/components/schemas/HarnessCapabilities'}
        capacity: {$ref: '#/components/schemas/HostCapacity'}
    HostCapacity:
      type: object
      description: >-
        The host's room for more VMs, measured when capabilities are read (feature hostCapacity).
        Admission of new, fork, resume and recover checks the same numbers.
      required: [freeMemoryBytes, freeDiskBytes, allocated, limits, liveVms, slots, reclaimable, waiting]
      properties:
        freeMemoryBytes:
          type: integer
          format: int64
          description: Available host memory (Linux MemAvailable).
        freeDiskBytes:
          type: integer
          format: int64
          description: Free space of the data dir.
        allocated: {$ref: '#/components/schemas/Shape'}
        limits: {$ref: '#/components/schemas/Limits'}
        liveVms:
          type: integer
          description: VMs holding a slot (provisioning to stopping).
        slots:
          type: integer
          description: How many more VMs of the default shape admission accepts now.
        totalMemoryBytes:
          type: integer
          format: int64
          description: Host memory (Linux MemTotal); absent where not measured.
        memoryBudgetBytes:
          type: integer
          format: int64
          description: >-
            What the live VMs' declared memory (`allocated.memoryBytes`) may sum to:
            `limits.memoryBytes` times `limits.memoryOvercommit`; absent when unlimited.
        reclaimable:
          type: integer
          description: Idle VMs admission would stop now to make room (feature capacityReclaim).
        waiting:
          type: array
          description: Requests queued for capacity (`waitSeconds`), first in line first.
          items: {$ref: '#/components/schemas/CapacityWaiter'}
    CapacityWaiter:
      type: object
      required: [ticket, memoryBytes, since]
      properties:
        ticket:
          type: string
          description: >-
            The first 16 hex digits of SHA-256 of the request's Idempotency-Key, so a client can
            find its own place without the queue revealing anyone's key.
        memoryBytes:
          type: integer
          format: int64
          description: Memory the request needs (0 if not known).
        since:
          type: string
          format: date-time
    Limits:
      type: object
      description: Administrator allocation bounds; zero means unlimited.
      required: [cpus, memoryBytes, diskBytes]
      properties:
        cpus: {type: integer}
        memoryBytes: {type: integer, format: int64}
        diskBytes: {type: integer, format: int64}
        minFreeDiskBytes:
          type: integer
          format: int64
          description: Free-space floor of the data dir (0 = default, negative = disabled).
        vms:
          type: integer
          description: Live VMs at once (0 = unlimited).
        minFreeMemoryBytes:
          type: integer
          format: int64
          description: Host memory that must stay available after admitting a VM (0 = default, negative = disabled).
        concurrentBoots:
          type: integer
          description: Boots (create, fork, resume, recover) running at once; the rest wait queued (0 = default 8, negative = unlimited).
        memoryOvercommit:
          type: number
          format: double
          description: >-
            Scales `memoryBytes` into the memory reservation budget: live VMs' declared memory may
            sum to `memoryBytes` times this (0 = default 1.5; otherwise at least 1), because VMs restored
            from one golden share pages.
        reclaimIdleAfterSeconds:
          type: integer
          format: int64
          description: >-
            How long a VM with an idle timeout must be idle before admission may stop it to make room
            (0 = default 120, negative = never).
    RuntimeCapabilities:
      type: object
      required: [engine, arch, coldBoot, goldenRestore, diskFork, ramSnapshot, ramCheckpointFormats, liveFork, guestTransport, shapeConstraints, fingerprintRules]
      properties:
        engine:
          type: string
        engineVersion:
          type: string
          description: Exact engine release in use, when known.
        arch:
          type: array
          items: {$ref: '#/components/schemas/Arch'}
        coldBoot:
          type: boolean
        goldenRestore:
          type: boolean
        diskFork:
          type: boolean
        ramSnapshot:
          type: boolean
        ramCheckpointFormats:
          type: array
          description: >-
            RAM checkpoint formats the engine can write and restore (for example `firecracker-1.x`).
            Empty when `ramSnapshot` is false. Checkpoints never convert across formats or engines.
          items: {type: string}
        liveFork:
          type: boolean
        guestTransport:
          type: string
          description: e.g. `vsock`, `hybrid-vsock-uds`, `none`.
        shapeConstraints: {$ref: '#/components/schemas/ShapeConstraints'}
        fingerprintRules:
          type: array
          description: Inputs that decide RAM checkpoint compatibility.
          items: {type: string}
        hostChecks:
          type: array
          description: Host preflight results the adapter measured (KVM access, engine binary).
          items: {$ref: '#/components/schemas/HostCheck'}
    HostCheck:
      type: object
      required: [name, ok]
      properties:
        name:
          type: string
        ok:
          type: boolean
        detail:
          type: string
    ShapeConstraints:
      type: object
      required: [maxCpus, minMemoryBytes, maxMemoryBytes, memoryAlignBytes, minDiskBytes]
      properties:
        maxCpus:
          type: integer
        minMemoryBytes:
          type: integer
          format: int64
        maxMemoryBytes:
          type: integer
          format: int64
        memoryAlignBytes:
          type: integer
          format: int64
        minDiskBytes:
          type: integer
          format: int64
    StorageCapabilities:
      type: object
      required: [mode, fastClone]
      properties:
        mode:
          type: string
          description: '`reflink` or `copy`.'
        fastClone:
          type: boolean
          description: True only when a real reflink probe succeeded.
        detail:
          type: string
    NetworkCapabilities:
      type: object
      required: [listeners, endpointModes, forwarding]
      properties:
        listeners:
          type: array
          description: e.g. `unix`, later `tsnet`.
          items: {type: string}
        endpointModes:
          type: array
          items: {type: string}
        forwarding:
          type: boolean

    # ---- images ------------------------------------------------------------
    Image:
      type: object
      description: Immutable, architecture-specific kernel/rootfs identified by digest.
      required: [id, ref, digest, arch, rootfsBytes, createdAt]
      properties:
        id:
          type: string
        ref:
          type: string
        digest:
          type: string
        arch: {$ref: '#/components/schemas/Arch'}
        rootfsBytes:
          type: integer
          format: int64
        defaultUser:
          type: string
          description: The image's login user (what `ssh <vm>@<gateway>` and SSH credentials default to).
        createdAt:
          type: string
          format: date-time
    ImageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Image'}
        nextCursor:
          type: string

    # ---- VMs ---------------------------------------------------------------
    Shape:
      type: object
      required: [cpus, memoryBytes, diskBytes]
      properties:
        cpus:
          type: integer
          minimum: 1
        memoryBytes:
          type: integer
          format: int64
        diskBytes:
          type: integer
          format: int64
    ShapeOverride:
      type: object
      description: Partial shape; omitted or zero fields keep the default/source value.
      properties:
        cpus:
          type: integer
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
        diskBytes:
          type: integer
          format: int64
          minimum: 0
    Readiness:
      type: object
      description: Reported separately from state; `ready` never implies services are healthy.
      required: [agent, ssh, services]
      properties:
        agent:
          type: boolean
        ssh:
          type: boolean
        services:
          type: object
          additionalProperties: {type: boolean}
    Endpoint:
      type: object
      required: [mode, state]
      properties:
        mode:
          type: string
          description: '`gateway` or `node`.'
        state:
          type: string
          description: '`pending`, `ready`, `error` or `none`.'
        gatewayFQDN:
          type: string
        vmFQDN:
          type: string
        sshTarget:
          type: string
        sshHostKeyFingerprints:
          type: array
          description: |
            SHA256 fingerprints of the guest's SSH host keys as reported to the
            authenticated restore barrier of the current generation. Pin these;
            never trust a guest host key on first use.
          items: {type: string}
    StorageInfo:
      type: object
      required: [mode, fastClone]
      properties:
        mode:
          type: string
          description: '`reflink` or `copy`.'
        fastClone:
          type: boolean
    VM:
      type: object
      description: Durable record of a machine. Environment values are never echoed.
      required:
        - id
        - owner
        - name
        - state
        - stateRevision
        - instanceGeneration
        - shape
        - imageId
        - bootMode
        - ttlSeconds
        - autoStop
        - readiness
        - endpoint
        - storage
        - egress
        - privacy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        owner:
          type: string
        name:
          type: string
        state: {$ref: '#/components/schemas/VMState'}
        stateRevision:
          type: integer
          format: int64
          description: Bumped on every state change; use with `If-Match`.
        instanceGeneration:
          type: integer
          format: int64
          minimum: 1
        shape: {$ref: '#/components/schemas/Shape'}
        imageId:
          type: string
        bootMode: {$ref: '#/components/schemas/BootMode'}
        ttlSeconds:
          type: integer
          format: int64
        autoStop:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        autoStopWarningAt:
          type: string
          format: date-time
          description: When the host starts warning about the auto-stop (expiresAt minus ttlWarningSeconds).
        activeOperationId:
          type: string
        lastError: {$ref: '#/components/schemas/ErrorInfo'}
        lastSnapshotId:
          type: string
        sourceSnapshotId:
          type: string
        readiness: {$ref: '#/components/schemas/Readiness'}
        endpoint: {$ref: '#/components/schemas/Endpoint'}
        storage: {$ref: '#/components/schemas/StorageInfo'}
        privacy: {$ref: '#/components/schemas/PrivacyPolicy'}
        egress: {$ref: '#/components/schemas/Egress'}
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        environment: {$ref: '#/components/schemas/EnvironmentPin'}
        workspace: {$ref: '#/components/schemas/Workspace'}
        labels:
          type: object
          description: >-
            Owner key/value tags (at most 32). Keys: 1-63 of a-z 0-9 . _ -, starting with a letter or
            digit; values: at most 255 printable ASCII bytes. `davit.box` marks a project box. Forks
            do not inherit labels.
          additionalProperties: {type: string}
        idleTimeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Stops the VM (keeping its disk) after this long with no exec, attached process stream or
            tunnel (ssh) activity. Absent or 0: never. Independent of the TTL.
        lastActivityAt:
          type: string
          format: date-time
          description: >-
            Last activity the idle timeout counts from (this daemon run's exec, stream or tunnel use,
            or the VM's last state change); present on ready/running VMs with an idle timeout.
    EgressMode:
      type: string
      description: |
        `off` blocks all guest traffic leaving the VM (DNS included).
        `filtered` (default) allows the public internet; private/LAN, host,
        link-local/metadata and CGNAT/tailnet ranges stay blocked.
        `allowlist` allows only `allow` entries, on top of the `filtered`
        rules: domain names resolve through the built-in DNS resolver, which
        answers NXDOMAIN for other names and admits the answered IPv4
        addresses for their TTL (clamped to 60 s - 1 h); CIDRs are admitted
        directly.
      enum: ['off', filtered, allowlist]
    PrivacyPolicy:
      type: object
      description: >-
        A VM's ephemeral and privacy policy (feature privacyPolicy); every flag defaults to false.
        It limits what davit keeps on the host. It is not secure erasure: deleted data may
        survive in host backups and filesystem remnants, and a guest can always write to its own disk.
      properties:
        ephemeral:
          type: boolean
          description: Delete the VM when it stops (explicit, TTL or forced); no snapshot is committed.
        noSnapshot:
          type: boolean
          description: A stop commits nothing and discards the working disk; a stopped VM cannot be resumed or forked, explicit snapshots are refused.
        noOutputRetention:
          type: boolean
          description: Keep no process output on the host (history lists processes without output).
        noProcessSamples:
          type: boolean
          description: Store no whole-guest process samples (ps still answers live).
    Egress:
      type: object
      description: |
        A VM's egress policy. On createVM, omitted means the host default
        (config `network.egress`, else `filtered`); on forkVM, omitted
        inherits the source VM's policy.
      required: [mode]
      properties:
        mode: {$ref: '#/components/schemas/EgressMode'}
        allow:
          type: array
          maxItems: 256
          description: |
            Allowlist entries (mode `allowlist` only): domain names
            (`github.com` also matches subdomains; `*.example.com` matches
            only subdomains) and IPv4 addresses/CIDRs. Returned normalized
            (lowercase, CIDRs masked, sorted, deduplicated).
          items: {type: string}
    VMList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/VM'}
        nextCursor:
          type: string
    CreateVMRequest:
      type: object
      description: '`image` and `snapshotId` are mutually exclusive.'
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        type:
          type: string
          description: Administrator-defined profile (capabilities.profiles); `shape` fields override it.
        image:
          type: string
          description: Image digest or ref.
        snapshotId:
          type: string
        shape: {$ref: '#/components/schemas/ShapeOverride'}
        env:
          type: object
          description: Guest environment. Never echoed back.
          additionalProperties: {type: string}
        ttlSeconds:
          type: integer
          format: int64
          minimum: 0
        autoStop:
          type: boolean
        requireGolden:
          type: boolean
          description: Fail with `unsupported_capability` instead of falling back to a cold boot.
        privacy: {$ref: '#/components/schemas/PrivacyPolicy'}
        egress: {$ref: '#/components/schemas/Egress'}
        environment: {$ref: '#/components/schemas/EnvironmentRef'}
        labels:
          type: object
          description: Key/value tags (see VM.labels).
          additionalProperties: {type: string}
        idleTimeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 2592000
          description: Stop the VM after this long without activity (see VM.idleTimeoutSeconds).
      not:
        required: [image, snapshotId]
    ForkVMRequest:
      type: object
      properties:
        snapshotId:
          type: string
          description: Fork from this snapshot of the VM instead of its current disk.
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        type:
          type: string
          description: Administrator-defined profile (capabilities.profiles); `shape` fields override it.
        shape: {$ref: '#/components/schemas/ShapeOverride'}
        ttlSeconds:
          type: integer
          format: int64
          minimum: 0
        autoStop:
          type: boolean
        egress: {$ref: '#/components/schemas/Egress'}
        live:
          type: boolean
          description: >-
            Fork the running VM itself (RAM, processes and disk captured at one instant, source paused
            briefly) instead of a committed disk snapshot. Requires capability liveFork; the child boots
            with bootMode ram_restore and gets a fresh identity. Mutually exclusive with snapshotId.
        environment: {$ref: '#/components/schemas/EnvironmentRef'}
    Profile:
      type: object
      required: [name, shape]
      properties:
        name:
          type: string
        shape: {$ref: '#/components/schemas/Shape'}
    UpdateVMRequest:
      type: object
      description: Every field is optional; only the fields present change.
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        ttlSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Sets the VM's TTL and, if it is ready or running, restarts the auto-stop countdown from
            now (`davit extend`).
        autoStop:
          type: boolean
        privacy: {$ref: '#/components/schemas/PrivacyPolicy'}
        egress: {$ref: '#/components/schemas/Egress'}
        idleTimeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 2592000
          description: Replaces the idle timeout (0 disables it); the countdown restarts now.
    StopVMRequest:
      type: object
      properties:
        force:
          type: boolean
          description: Skip graceful guest shutdown; the commit is then crash-consistent.
    ResumeVMRequest:
      type: object
      properties:
        ttlSeconds:
          type: integer
          format: int64
          minimum: 0
        autoStop:
          type: boolean
        environment: {$ref: '#/components/schemas/EnvironmentRef'}
        type:
          type: string
          description: Profile to resize to (feature resize).
        shape: {$ref: '#/components/schemas/ShapeOverride'}
    RecoverVMRequest:
      type: object
      description: Empty; reserved for options.
    CreateVMsRequest:
      type: object
      required: [count, template]
      properties:
        count:
          type: integer
          minimum: 1
          maximum: 100
        template: {$ref: '#/components/schemas/CreateVMRequest'}
    ReclaimVMsRequest:
      type: object
      required: [idleSeconds]
      properties:
        idleSeconds:
          type: integer
          format: int64
          minimum: 0
          description: Stop VMs with no activity for at least this long.
        labels:
          type: object
          description: Only VMs carrying all of these labels.
          additionalProperties: {type: string}
        dryRun:
          type: boolean
          description: List the VMs without stopping them.
    ReclaimVMsResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Oldest activity first.
          items: {$ref: '#/components/schemas/ReclaimedVM'}
    ReclaimedVM:
      type: object
      required: [vmId, name, idleSeconds, memoryBytes]
      properties:
        vmId:
          type: string
        name:
          type: string
        idleSeconds:
          type: integer
          format: int64
        memoryBytes:
          type: integer
          format: int64
        operationId:
          type: string
          description: The stop (absent with dryRun).
    CreateVMsResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BatchItem'}
    BatchItem:
      type: object
      description: >-
        One item of a batch, accepted or refused. An item is idempotent on its own (the batch's
        Idempotency-Key plus its index), so a replayed batch returns the same operations.
      required: [index]
      properties:
        index:
          type: integer
          description: 1-based position in the batch.
        name:
          type: string
        accepted: {$ref: '#/components/schemas/OperationAccepted'}
        error: {$ref: '#/components/schemas/Error'}
    SnapshotVMRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'

    # ---- operations --------------------------------------------------------
    OpResult:
      type: object
      description: Terminal success payload.
      required: [durationMs]
      properties:
        vmId:
          type: string
        snapshotId:
          type: string
        bootMode: {$ref: '#/components/schemas/BootMode'}
        noop:
          type: boolean
          description: The request was a safe no-op (e.g. stop on a stopped VM).
        durationMs:
          type: integer
          format: int64
          description: Measured wall time from start to terminal state.
    Operation:
      type: object
      description: Durable asynchronous intent; survives client disconnect and daemon restart.
      required: [id, kind, vmId, owner, state, phase, progress, createdAt, updatedAt]
      properties:
        id:
          type: string
        kind: {$ref: '#/components/schemas/OperationKind'}
        vmId:
          type: string
        owner:
          type: string
        state: {$ref: '#/components/schemas/OperationState'}
        phase:
          type: string
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        result: {$ref: '#/components/schemas/OpResult'}
        error: {$ref: '#/components/schemas/ErrorInfo'}
        reason:
          type: string
          description: >-
            Why the host stopped the VM on its own: `idle` (its idle timeout), `ttl` (auto-stop),
            `reclaim` (to make room for another VM) or `gc` (reclaimVMs); absent for a stop a
            client asked for. Open set.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    OperationAccepted:
      type: object
      description: 202 body of every lifecycle mutation.
      required: [operation]
      properties:
        operation: {$ref: '#/components/schemas/Operation'}
        vm: {$ref: '#/components/schemas/VM'}
    OperationEvent:
      type: object
      description: One ordered progress record; `(operationId, seq)` is the cursor.
      required: [operationId, seq, time, state, phase, progress]
      properties:
        operationId:
          type: string
        seq:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        state: {$ref: '#/components/schemas/OperationState'}
        phase:
          type: string
        progress:
          type: number
          format: double
          minimum: 0
          maximum: 1
        message:
          type: string
    OperationEventList:
      type: object
      required: [operation, items]
      properties:
        operation: {$ref: '#/components/schemas/Operation'}
        items:
          type: array
          items: {$ref: '#/components/schemas/OperationEvent'}
        nextCursor:
          type: string
          description: Last returned `seq` as a decimal string; pass it as `after`.

    # ---- snapshots ---------------------------------------------------------
    Snapshot:
      type: object
      description: |
        Immutable committed disk generation. An empty `name` marks an automatic
        stop commit owned by its VM: it is kept while it is the VM's last
        committed state or something depends on it, and is collected with the
        VM. Named snapshots survive VM deletion. Several snapshots may name the
        same committed data; the host-internal storage manifest is not exposed.
      required: [id, owner, sourceVmId, generation, imageId, arch, kind, consistency, sizeBytes, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        owner:
          type: string
        sourceVmId:
          type: string
        generation:
          type: integer
          format: int64
          description: The source VM's instanceGeneration whose disk was committed.
        imageId:
          type: string
        arch: {$ref: '#/components/schemas/Arch'}
        kind: {$ref: '#/components/schemas/SnapshotKind'}
        consistency: {$ref: '#/components/schemas/Consistency'}
        sizeBytes:
          type: integer
          format: int64
          description: Logical disk size; a fork's disk cannot be smaller.
        digest:
          type: string
          description: '`sha256:` of the immutable storage manifest (identifies the commit, not a hash of the disk bytes).'
        createdAt:
          type: string
          format: date-time
          description: When the disk data was committed (shared by snapshots naming the same commit).
    SnapshotList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Snapshot'}
        nextCursor:
          type: string

    ExecRequest:
      type: object
      description: |
        `argv` is executed directly; a shell is never inferred from the
        argument count (use `["sh","-c","..."]` explicitly).
      required: [argv]
      properties:
        argv:
          type: array
          minItems: 1
          items: {type: string}
        cwd:
          type: string
        env:
          type: object
          additionalProperties: {type: string}
        user:
          type: string
          description: Guest user to run as (default the image's user).
        deadlineSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Kill the process group after this many seconds.
        detached:
          type: boolean
          default: false
        stdin:
          type: boolean
          default: false
          description: Keep stdin open for the first attached stream.
        tty:
          type: boolean
          default: false
    ProcessStatus:
      type: string
      description: |
        `unknown`/`lost` mean the outcome could not be determined (e.g. the
        instance restarted). Clients MUST tolerate unknown values.
      enum: [starting, running, exited, killed, unknown, lost]
    Process:
      type: object
      required: [id, vmId, generation, status, argv, detached, outputCursor, createdAt]
      properties:
        id:
          type: string
        vmId:
          type: string
        generation:
          type: integer
          format: int64
          description: VM instance generation the process belongs to.
        status: {$ref: '#/components/schemas/ProcessStatus'}
        argv:
          type: array
          items: {type: string}
        detached:
          type: boolean
        exitCode:
          type: integer
        signal:
          type: string
        timedOut:
          type: boolean
          description: The process was killed by its `deadlineSeconds`.
        outputCursor:
          type: integer
          format: int64
          description: Seq of the last output chunk produced; attach after any retained seq.
        createdAt:
          type: string
          format: date-time
        exitedAt:
          type: string
          format: date-time
    ProcessList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Process'}
        nextCursor:
          type: string
    ProcessStreamMessage:
      type: object
      description: One attachProcess WebSocket message.
      required: [type]
      properties:
        type:
          type: string
          description: |
            Server: `stdout`, `stderr`, `exit`, `error`. Client: `stdin`,
            `stdin.close`, `signal`. Unknown types must be ignored.
        seq:
          type: integer
          format: int64
        data:
          type: string
          description: Base64 (standard) bytes of a stdout/stderr/stdin chunk.
        signal:
          type: string
        process: {$ref: '#/components/schemas/Process'}
        error: {$ref: '#/components/schemas/Error'}

    FileInfo:
      type: object
      required: [path, sizeBytes, mode, generation]
      properties:
        path:
          type: string
        sizeBytes:
          type: integer
          format: int64
          description: Bytes uploaded (the tar stream for archives).
        mode:
          type: string
          description: |
            Octal permission bits now on the file, e.g. `0644`; for archives,
            the mode requested for a newly created directory.
        sha256:
          type: string
          description: Hex SHA-256 of the uploaded bytes, verified by the agent.
        generation:
          type: integer
          format: int64
        archive:
          type: boolean

    PromptRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        harness:
          type: string
          description: '`claude` (default; alias `claude-code`), `codex`, `opencode` or `pi` (`capabilities.harnesses`).'
        conversationId:
          type: string
          description: Continue this conversation.
        new:
          type: boolean
          description: Start a new conversation.
        model:
          type: string
        cwd:
          type: string
          description: Guest working directory of a new conversation (default the user's home).
        env:
          type: object
          additionalProperties: {type: string}
          description: Environment for the harness process; values enter the guest and are not stored.
        secrets:
          type: array
          items: {type: string}
          description: Names of daemon-configured secrets to pass as same-named environment variables.
        attachments:
          type: array
          maxItems: 32
          description: >-
            Files for the turn (feature promptAttachments; types in `harnesses[].attachmentTypes`).
            Inline data is placed in a per-turn guest directory; images go to the harness natively and
            every attachment is named in the prompt by guest path.
          items: {$ref: '#/components/schemas/PromptAttachment'}
        options: {$ref: '#/components/schemas/PromptOptions'}
        turnTimeoutSeconds:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Bounds the turn (default: the daemon's harness.defaultTurnTimeout, 1h unless
            configured; at most 86400); the guest kills the harness at
            `turnDeadlineAt` and the turn fails with `turn_timeout`. While it runs, the turn holds
            the VM's auto-stop (feature promptTurnLease).
    PromptState:
      type: string
      enum: [starting, running, succeeded, failed, cancelled]
    PromptUsage:
      type: object
      required: [inputTokens, outputTokens]
      properties:
        inputTokens: {type: integer, format: int64}
        outputTokens: {type: integer, format: int64}
        cachedInputTokens: {type: integer, format: int64}
        costUsd: {type: number}
    PromptError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            harness_missing, harness_failed, harness_exit, cancelled, lost, turn_timeout or attachment;
            tolerate others.
        message:
          type: string
    Prompt:
      type: object
      required: [id, conversationId, vmId, harness, state, eventCursor, createdAt]
      properties:
        id: {type: string}
        conversationId: {type: string}
        vmId: {type: string}
        harness: {type: string}
        model: {type: string}
        state: {$ref: '#/components/schemas/PromptState'}
        processId: {type: string}
        eventCursor:
          type: integer
          format: int64
          description: Seq of the last event recorded.
        usage: {$ref: '#/components/schemas/PromptUsage'}
        error: {$ref: '#/components/schemas/PromptError'}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        turnDeadlineAt:
          type: string
          format: date-time
          description: When the active-turn lease ends (promptTurnLease).
    Conversation:
      type: object
      required: [id, vmId, harness, turns, createdAt, updatedAt]
      properties:
        id: {type: string}
        vmId: {type: string}
        harness: {type: string}
        model: {type: string}
        cwd: {type: string}
        sessionId:
          type: string
          description: Harness-native session that later turns resume.
        activePromptId: {type: string}
        turns: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ConversationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Conversation'}
        nextCursor: {type: string}
    PromptEvent:
      type: object
      description: |
        A normalized harness event. Types: `conversation.started`
        (sessionId), `message.delta` (role, text), `tool.call` (toolCallId,
        toolName, input), `tool.result` (toolCallId, output, isError),
        `turn.completed` (status succeeded|failed|cancelled, usage, error,
        always last), and `raw` for harness lines without a mapping. `raw`
        carries the harness's own line on every event. Tolerate unknown types.
      required: [seq, time, promptId, conversationId, type]
      properties:
        seq: {type: integer, format: int64}
        time: {type: string, format: date-time}
        promptId: {type: string}
        conversationId: {type: string}
        type: {type: string}
        sessionId: {type: string}
        role: {type: string}
        text: {type: string}
        toolCallId: {type: string}
        toolName: {type: string}
        input: {}
        output: {type: string}
        isError: {type: boolean}
        status: {type: string}
        usage: {$ref: '#/components/schemas/PromptUsage'}
        error: {$ref: '#/components/schemas/PromptError'}
        raw: {}
    PromptEventList:
      type: object
      required: [prompt, items]
      properties:
        prompt: {$ref: '#/components/schemas/Prompt'}
        items:
          type: array
          items: {$ref: '#/components/schemas/PromptEvent'}
        nextCursor: {type: string}

    MemberRole:
      type: string
      enum: [viewer, exec, admin]
    ShareKind:
      type: string
      enum: [vm, snapshot, environment]
    Member:
      type: object
      required: [id, login, role, addedAt]
      properties:
        id: {type: string}
        login: {type: string}
        userId:
          type: integer
          format: int64
          description: Stable tailnet user ID, pinned at the first connection (absent until then).
        role: {$ref: '#/components/schemas/MemberRole'}
        addedAt: {type: string, format: date-time}
    AddMemberRequest:
      type: object
      required: [login, role]
      properties:
        login: {type: string}
        role: {$ref: '#/components/schemas/MemberRole'}
    UpdateMemberRequest:
      type: object
      required: [role]
      properties:
        role: {$ref: '#/components/schemas/MemberRole'}
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Member'}
    Share:
      type: object
      required: [id, kind, resourceId, member, credentials, createdAt]
      properties:
        id: {type: string}
        kind: {$ref: '#/components/schemas/ShareKind'}
        resourceId: {type: string}
        member:
          type: string
          description: Member ID, or "*" for every member (role absent then means each member's own role).
        role: {$ref: '#/components/schemas/MemberRole'}
        credentials:
          type: boolean
          description: The member(s) may use the VM's credential grants; off, an exec or admin share pauses them.
        createdAt: {type: string, format: date-time}
    CreateShareRequest:
      type: object
      required: [kind, resource, member]
      properties:
        kind: {$ref: '#/components/schemas/ShareKind'}
        resource:
          type: string
          description: VM, snapshot or environment ID or name.
        member:
          type: string
          description: Member ID, login, or "*".
        role: {$ref: '#/components/schemas/MemberRole'}
        credentials: {type: boolean}
    ShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Share'}
    AppEndpointKind:
      type: string
      enum: [http, desktop]
    OpenDesktopRequest:
      type: object
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Guest VNC server port (default 5900).
    AppEndpointState:
      type: string
      enum: [active, hidden, vm_not_running, gateway_down]
    AppEndpoint:
      type: object
      required: [id, vmId, name, port, kind, gatewayPort, hidden, forwardIdentity, state, createdAt]
      properties:
        id: {type: string}
        vmId: {type: string}
        name:
          type: string
          description: Unique within the VM; a DNS label without "--".
        port:
          type: integer
          description: Guest loopback port of the app.
        kind: {$ref: '#/components/schemas/AppEndpointKind'}
        url:
          type: string
          description: Stable tailnet URL; empty until the gateway knows its name.
        gatewayPort:
          type: integer
          description: Gateway port allocated to the endpoint for life.
        hidden: {type: boolean}
        forwardIdentity:
          type: boolean
          description: |
            Send the caller's tailnet login to the app as `Tailscale-User-Login`.
            Off by default: the guest is untrusted and learns nothing about who
            is on the tailnet unless the owner asks. A client-sent value is
            always dropped.
        state: {$ref: '#/components/schemas/AppEndpointState'}
        createdAt: {type: string, format: date-time}
    CreateAppEndpointRequest:
      type: object
      required: [port]
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
        name:
          type: string
          description: Defaults to `port-<port>`.
        forwardIdentity:
          type: boolean
          description: See `AppEndpoint.forwardIdentity`; default false.
    UpdateAppEndpointRequest:
      type: object
      properties:
        name: {type: string}
        hidden: {type: boolean}
        forwardIdentity: {type: boolean}
    AppEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AppEndpoint'}
    ReverseTargetKind:
      type: string
      enum: [session, host]
    ReverseForwardState:
      type: string
      enum: [awaiting_session, active]
    ReverseSessionEventType:
      type: string
      enum: [connection, ping, revoked]
    ReverseTarget:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/ReverseTargetKind'}
        address:
          type: string
          description: |
            `host`: the host service as `ip:port`, listed exactly in
            network.reverseHostServices. `session`: an optional label of where
            the client forwards (shown in lists, never dialed by the daemon).
    CreateReverseForwardRequest:
      type: object
      required: [guestPort, target]
      properties:
        guestPort:
          type: integer
          minimum: 1
          maximum: 65535
        target: {$ref: '#/components/schemas/ReverseTarget'}
    ReverseForward:
      type: object
      required: [id, vmId, generation, guestPort, target, state, active, createdAt]
      properties:
        id: {type: string}
        vmId: {type: string}
        generation: {type: integer, format: int64}
        guestPort: {type: integer}
        target: {$ref: '#/components/schemas/ReverseTarget'}
        state: {$ref: '#/components/schemas/ReverseForwardState'}
        active:
          type: integer
          description: Guest connections bridged right now.
        createdAt: {type: string, format: date-time}
        sessionExpiresAt:
          type: string
          format: date-time
          description: When an unattached session forward is revoked.
    ReverseForwardList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReverseForward'}
    ReverseSessionEvent:
      type: object
      required: [type]
      properties:
        type: {$ref: '#/components/schemas/ReverseSessionEventType'}
        connectionId: {type: string}
        reason: {type: string}

    # ---- not implemented yet (no Go types) ---------------------------------
    OpenTunnelRequest:
      type: object
      required: [port]
      properties:
        port:
          type: integer
          minimum: 1
          maximum: 65535
    Tunnel:
      type: object
      required: [id, vmId, generation, port, createdAt, expiresAt]
      properties:
        id:
          type: string
        vmId:
          type: string
        generation:
          type: integer
          format: int64
        port:
          type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    IssueSSHCredentialRequest:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
          description: Temporary client public key (OpenSSH authorized_keys format).
        guestUser:
          type: string
          description: Guest login user; default `user`.
        ttlSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 600
          description: Certificate lifetime; default 300, maximum 600.
    SSHCredential:
      type: object
      required: [certificate, guestUser, generation, hostKeys, sshTarget, expiresAt]
      properties:
        certificate:
          type: string
          description: Short-lived OpenSSH certificate signed by the host CA.
        guestUser:
          type: string
        generation:
          type: integer
          format: int64
        hostKeys:
          type: array
          description: Guest host public keys to pin; never disable host-key checking.
          items: {type: string}
        sshTarget:
          type: string
        expiresAt:
          type: string
          format: date-time
    TokenScope:
      type: object
      required: [actions]
      properties:
        vmId:
          type: string
          description: Restrict to one VM; omitted means all VMs the issuer can access.
        actions:
          type: array
          items:
            type: string
            enum: [view, exec, admin]
    CreateTokenRequest:
      type: object
      required: [name, scopes, ttlSeconds]
      properties:
        name:
          type: string
        scopes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/TokenScope'}
        ttlSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 31536000
          description: Lifetime; at most one year.
    Token:
      type: object
      required: [id, name, scopes, createdAt, expiresAt, useCount]
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items: {$ref: '#/components/schemas/TokenScope'}
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        useCount:
          type: integer
          format: int64
          description: Requests that presented the token (feature tokenUsage); written in batches with lastUsedAt, so a daemon crash may lose the last minute of uses.
    RotateTokenRequest:
      type: object
      properties:
        overlapSeconds:
          type: integer
          format: int64
          minimum: 0
          description: How long the old secret keeps working (0, the default, revokes it at once).
        ttlSeconds:
          type: integer
          format: int64
          minimum: 1
          description: Lifetime of the new token; omitted keeps the old token's lifetime.
    Me:
      type: object
      description: Who the caller is to this daemon. Never carries a secret.
      required: [principal, auth, host, version]
      properties:
        principal: {type: string}
        auth:
          type: string
          enum: [local, tailnet, token, member]
          description: '`local`: the owner over the Unix socket; `tailnet`: an owner identity on the gateway; `token`: a service token; `member`: a tailnet member using what is shared with it.'
        identity:
          type: string
          description: The transport identity, e.g. `uid 1000` or a tailnet login and node.
        token: {$ref: '#/components/schemas/Token'}
        member: {$ref: '#/components/schemas/MeMember'}
        host: {type: string}
        version: {type: string}
    MeMember:
      type: object
      description: >-
        A member's access: shared VMs as scopes (the member role as a token action: viewer=view, exec,
        admin), shared snapshots and environments (ID to action).
      required: [id, login, scopes]
      properties:
        id: {type: string}
        login: {type: string}
        scopes:
          type: array
          items: {$ref: '#/components/schemas/TokenScope'}
        snapshots:
          type: object
          additionalProperties: {type: string}
        environments:
          type: object
          additionalProperties: {type: string}
    CreatedToken:
      type: object
      description: A token plus its secret, returned only once at creation.
      required: [id, name, scopes, createdAt, expiresAt, secret]
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items: {$ref: '#/components/schemas/TokenScope'}
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        secret:
          type: string
          description: 'The bearer token: `Authorization: Bearer <secret>`.'
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Token'}
        nextCursor:
          type: string
    # G16 events and webhooks.
    Event:
      type: object
      description: |
        One entry of the host event stream, in seq order. Types: vm.created, vm.state,
        operation.created, operation.state, operation.progress, run.created, run.state,
        prompt.created, prompt.state, golden.evicted; tolerate unknown types. data is an allowlisted summary
        (IDs, states, error codes): never environment values, prompt text or secrets.
      required: [seq, type, time, subject, data]
      properties:
        seq: {type: integer, format: int64}
        type: {type: string}
        time: {type: string, format: date-time}
        vmId: {type: string}
        subject: {type: string}
        data: {type: object, additionalProperties: true}
    EventList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Event'}
        nextCursor: {type: string}
    Webhook:
      type: object
      required: [id, url, events, enabled, createdAt, updatedAt, pending, dead]
      properties:
        id: {type: string}
        url: {type: string}
        description: {type: string}
        events:
          type: array
          items: {type: string}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        previousSecretExpiresAt: {type: string, format: date-time}
        pending: {type: integer, format: int64}
        dead: {type: integer, format: int64}
    WebhookList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Webhook'}
        nextCursor: {type: string}
    CreateWebhookRequest:
      type: object
      required: [url]
      properties:
        url: {type: string, description: "http or https URL that receives POSTed deliveries."}
        events:
          type: array
          items: {type: string}
        description: {type: string}
        enabled: {type: boolean}
    UpdateWebhookRequest:
      type: object
      properties:
        url: {type: string}
        events:
          type: array
          items: {type: string}
        description: {type: string}
        enabled: {type: boolean}
    RotateWebhookSecretRequest:
      type: object
      properties:
        overlapSeconds: {type: integer, format: int64, minimum: 0, maximum: 604800}
    WebhookSecret:
      type: object
      required: [webhook, secret]
      properties:
        webhook: {$ref: '#/components/schemas/Webhook'}
        secret: {type: string}
    WebhookDelivery:
      type: object
      required: [id, webhookId, eventSeq, eventType, state, attempts, createdAt]
      properties:
        id: {type: string}
        webhookId: {type: string}
        eventSeq: {type: integer, format: int64}
        eventType: {type: string}
        state: {type: string, enum: [pending, delivered, dead]}
        attempts: {type: integer}
        nextAttemptAt: {type: string, format: date-time}
        lastStatus: {type: integer}
        lastError: {type: string}
        createdAt: {type: string, format: date-time}
        deliveredAt: {type: string, format: date-time}
    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WebhookDelivery'}
        nextCursor: {type: string}
    WebhookPayload:
      type: object
      required: [deliveryId, webhookId, event]
      properties:
        deliveryId: {type: string}
        webhookId: {type: string}
        event: {$ref: '#/components/schemas/Event'}
    # Parity v1 contract schemas (docs/research/CONTRACT-v1.md).
    FeatureStatus:
      type: string
      enum: [available, not_implemented, unsupported]
      description: |
        `not_implemented`: specified, not built; its operations answer `not_implemented`.
        `unsupported`: built, but this host or backend cannot provide it (`unsupported_capability`).
    Feature:
      type: object
      required: [name, status, gap, operations]
      properties:
        name: {type: string}
        status: {$ref: '#/components/schemas/FeatureStatus'}
        gap:
          type: string
          description: PARITY.md gap ID, e.g. G3.
        operations:
          type: array
          description: operationIds (and request fields as `operationId.field`) the feature covers.
          items: {type: string}
        detail: {type: string}
    SteerSupport:
      type: string
      enum: [native, restart, unsupported]
      description: |
        `native`: the running turn takes the message. `restart`: the turn is cancelled and a new
        turn carries the message (reported as such). `unsupported`: steerPrompt answers
        `unsupported_capability`.
    HarnessCapabilities:
      type: object
      required: [name, steer, attachmentTypes, reasoningEfforts, fast]
      properties:
        name: {type: string}
        steer: {$ref: '#/components/schemas/SteerSupport'}
        attachmentTypes:
          type: array
          description: Accepted attachment media types; empty means none.
          items: {type: string}
        reasoningEfforts:
          type: array
          items: {type: string}
        fast: {type: boolean}
        experimental:
          type: boolean
          description: >-
            The adapter follows the harness CLI's documentation but has not yet been accepted against a
            real harness run; its flags and event mapping may change. Absent means false.

    Environment:
      type: object
      required: [id, name, latestRevision, createdAt, updatedAt]
      properties:
        id: {type: string}
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        latestRevision: {type: integer, format: int64, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    EnvironmentRevision:
      type: object
      required: [environmentId, revision, manifest, createdAt]
      properties:
        environmentId: {type: string}
        revision: {type: integer, format: int64, minimum: 1}
        manifest: {$ref: '#/components/schemas/EnvManifest'}
        createdAt: {type: string, format: date-time}
    EnvManifest:
      type: object
      description: |
        How to prepare a workspace. Holds no secret values: secret files name host secrets, which
        the host delivers over the authenticated guest session at preparation time.
      required: [repos, variables, secretFiles, setup]
      properties:
        repos:
          type: array
          items: {$ref: '#/components/schemas/RepoSpec'}
        variables:
          type: object
          description: Non-secret environment variables of guest processes.
          additionalProperties: {type: string}
        secretFiles:
          type: array
          items: {$ref: '#/components/schemas/SecretFileRef'}
        setup:
          type: array
          description: Run in order after repos and files; the first failure fails the workspace.
          items: {$ref: '#/components/schemas/SetupAction'}
        credentialProfile:
          type: string
          description: Profile whose grants new VMs receive (G4).
    RepoSpec:
      type: object
      required: [url, path]
      properties:
        url:
          type: string
          description: Any Git URL, without credentials (private access comes from a credential grant).
        ref:
          type: string
          description: Branch, tag or commit; empty means the default branch.
        path:
          type: string
          description: Absolute guest path.
    SecretFileRef:
      type: object
      required: [path, secret]
      properties:
        path: {type: string}
        secret:
          type: string
          description: Name of a host secret.
        mode:
          type: string
          pattern: '^[0-7]{3,4}$'
          description: Octal permission bits, default 0600.
    SetupAction:
      type: object
      required: [name, argv]
      properties:
        name: {type: string}
        argv:
          type: array
          minItems: 1
          items: {type: string}
        cwd: {type: string}
        user: {type: string}
        timeoutSeconds: {type: integer, format: int64, minimum: 0}
    EnvironmentRef:
      type: object
      required: [environment]
      properties:
        environment:
          type: string
          description: Environment ID or name.
        revision:
          type: integer
          format: int64
          minimum: 0
          description: 0 or absent means the latest at request time; the VM pins that number.
    EnvironmentPin:
      type: object
      required: [environmentId, name, revision]
      properties:
        environmentId: {type: string}
        name: {type: string}
        revision: {type: integer, format: int64}
    WorkspaceState:
      type: string
      enum: [pending, preparing, ready, failed]
      description: Workspace preparation state; distinct from VM readiness. A failed workspace leaves the VM usable.
    Workspace:
      type: object
      required: [state]
      properties:
        state: {$ref: '#/components/schemas/WorkspaceState'}
        startedAt: {type: string, format: date-time}
        readyAt: {type: string, format: date-time}
        error: {$ref: '#/components/schemas/SetupError'}
    SetupError:
      type: object
      description: Which preparation step failed; step and phase are absent when it failed outside a step.
      required: [message]
      properties:
        step: {type: string}
        phase:
          type: string
          enum: [clone, file, setup]
        exitCode: {type: integer}
        message: {type: string}
    CreateEnvironmentRequest:
      type: object
      required: [name, manifest]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        manifest: {$ref: '#/components/schemas/EnvManifest'}
    CreateEnvironmentRevisionRequest:
      type: object
      required: [manifest]
      properties:
        manifest: {$ref: '#/components/schemas/EnvManifest'}
    EnvironmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Environment'}
        nextCursor: {type: string}
    EnvironmentRevisionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/EnvironmentRevision'}
        nextCursor: {type: string}

    CredentialKind:
      type: string
      enum: [api_key, custom_api]
    Credential:
      type: object
      description: Credential metadata; the secret is write-only and never returned.
      required: [name, kind, envVar, hasSecret, updatedAt]
      properties:
        name: {type: string}
        kind: {$ref: '#/components/schemas/CredentialKind'}
        provider: {type: string}
        baseUrl: {type: string}
        envVar:
          type: string
          description: Guest variable that carries a grant's placeholder.
        hasSecret: {type: boolean}
        updatedAt: {type: string, format: date-time}
    CredentialProfile:
      type: object
      required: [id, name, default, credentials, createdAt, updatedAt]
      properties:
        id: {type: string}
        name: {type: string}
        default: {type: boolean}
        credentials:
          type: array
          items: {$ref: '#/components/schemas/Credential'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateCredentialProfileRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        default: {type: boolean}
    PutCredentialRequest:
      type: object
      required: [kind, envVar, secret]
      properties:
        kind: {$ref: '#/components/schemas/CredentialKind'}
        provider: {type: string}
        baseUrl: {type: string}
        envVar: {type: string}
        secret:
          type: string
          description: Write-only. Stored on the host only; never returned, never sent to a guest.
    CredentialProfileList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CredentialProfile'}
        nextCursor: {type: string}
    GrantState:
      type: string
      enum: [active, revoked]
    RevokeReason:
      type: string
      enum: [revoked, vm_deleted, profile_deleted, credential_removed]
    CredentialGrant:
      type: object
      description: |
        Proxied use of one credential by one VM. The guest sees only `placeholder` (in `envVar`);
        the host proxy swaps it for the real key on requests to `upstream`. Grants bind to the VM
        ID: stop keeps them (dormant), resume reuses them, a fork child inherits none (the copied
        placeholder is refused from the child), delete revokes them (`vm_deleted`).
      required: [id, vmId, profileId, credential, state, placeholder, envVar, upstream, createdAt]
      properties:
        id: {type: string}
        vmId: {type: string}
        profileId: {type: string}
        credential: {type: string}
        state: {$ref: '#/components/schemas/GrantState'}
        placeholder: {type: string}
        envVar: {type: string}
        upstream: {type: string}
        revokeReason: {$ref: '#/components/schemas/RevokeReason'}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    CreateCredentialGrantRequest:
      type: object
      required: [profile, credential]
      properties:
        profile:
          type: string
          description: Profile ID or name.
        credential: {type: string}
    CredentialGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CredentialGrant'}
        nextCursor: {type: string}

    PromptAttachment:
      type: object
      description: A file for the turn. Exactly one of `path` (a guest file) and `data` (inline base64).
      required: [name, mediaType]
      properties:
        name: {type: string}
        mediaType: {type: string}
        path: {type: string}
        data:
          type: string
          description: Inline file bytes, base64 (standard encoding).
    PromptOptions:
      type: object
      description: Harness controls; `harnesses[]` in capabilities says which a harness accepts.
      properties:
        reasoningEffort: {type: string}
        fast: {type: boolean}
    PromptFeedItem:
      type: object
      required: [cursor, event]
      properties:
        cursor:
          type: string
          description: Orders the VM-wide feed across prompts; pass the last one as `after`.
        event: {$ref: '#/components/schemas/PromptEvent'}
    PromptFeed:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PromptFeedItem'}
        nextCursor: {type: string}
    InterruptRequest:
      type: object
      description: One conversation's active turn, or every active turn with `all`.
      properties:
        conversationId: {type: string}
        all: {type: boolean}
    InterruptResult:
      type: object
      required: [cancelled]
      properties:
        cancelled:
          type: array
          items: {$ref: '#/components/schemas/Prompt'}
    SteerRequest:
      type: object
      required: [text]
      properties:
        text: {type: string}
    SteerResult:
      type: object
      required: [delivery, prompt]
      properties:
        delivery: {$ref: '#/components/schemas/SteerSupport'}
        prompt: {$ref: '#/components/schemas/Prompt'}

    RunState:
      type: string
      enum: [creating, waiting, running, succeeded, failed, cancelled]
    RunRequest:
      type: object
      description: |
        Create a VM, run `argv` in it, keep the exit code and delete the VM unless `keep`.
        `image` and `snapshotId` are exclusive. `hold` stops in `waiting` so the client can
        pushTree its files before startRun.
      required: [argv]
      properties:
        image: {type: string}
        snapshotId: {type: string}
        type: {type: string}
        shape: {$ref: '#/components/schemas/ShapeOverride'}
        environment: {$ref: '#/components/schemas/EnvironmentRef'}
        argv:
          type: array
          minItems: 1
          items: {type: string}
        cwd: {type: string}
        env:
          type: object
          additionalProperties: {type: string}
        timeoutSeconds: {type: integer, format: int64, minimum: 0}
        keep: {type: boolean}
        hold: {type: boolean}
        outputGraceSeconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 600
          description: >-
            How long the VM outlives the command so a client can still read its output (0: none).
            Omitted: the host default (daemon config runs.outputGrace, 5s unless configured).
    Run:
      type: object
      description: >-
        `outcome` is the run's result as soon as it is known; `state` becomes it once cleanup ends
        (output grace, VM delete). Calling cancelRun after `outcome` is set only ends the grace.
      required: [id, state, keep, createdAt]
      properties:
        id: {type: string}
        state: {$ref: '#/components/schemas/RunState'}
        vmId: {type: string}
        processId: {type: string}
        exitCode: {type: integer}
        signal:
          type: string
          description: The signal that killed the command (outcome failed, no error).
        outcome: {$ref: '#/components/schemas/RunState'}
        decidedAt:
          type: string
          format: date-time
          description: When `outcome` was decided.
        keep: {type: boolean}
        error: {$ref: '#/components/schemas/Error'}
        createdAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        labels:
          type: object
          additionalProperties: {type: string}
    RunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        nextCursor: {type: string}
    PushResult:
      type: object
      required: [path, files, bytes, removed, sha256, generation]
      properties:
        path: {type: string}
        files:
          type: integer
          description: Regular files and symlinks in the tree.
        bytes:
          type: integer
          format: int64
          description: Size of the tar as received.
        removed:
          type: integer
          description: Files deleted by mode=mirror.
        sha256: {type: string}
        generation: {type: integer, format: int64}

    HistoryEntry:
      type: object
      required: [process, handle, stdoutBytes, stderrBytes, outputDropped]
      properties:
        process: {$ref: '#/components/schemas/Process'}
        handle:
          type: string
          description: Durable job handle known to the guest agent (guest protocol feature "jobs").
        stdoutBytes: {type: integer, format: int64}
        stderrBytes: {type: integer, format: int64}
        outputDropped:
          type: boolean
          description: The retention limit cut the oldest output.
        outputNotRetained: {$ref: '#/components/schemas/OutputNotRetainedReason'}
    OutputNotRetainedReason:
      type: string
      enum: [policy]
      description: >-
        Why the host kept none (or not all) of a job's output, apart from the retention limit
        (`outputDropped`). `policy`: the VM's privacy policy `noOutputRetention` was on while the job
        ran, or was turned on later and purged its output. Absent when the output was kept.
    HistoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/HistoryEntry'}
        nextCursor: {type: string}
    ProcessOutput:
      type: object
      required: [items, complete]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProcessStreamMessage'}
        nextCursor: {type: string}
        complete:
          type: boolean
          description: The process ended and every retained chunk was returned.
    GuestProcess:
      type: object
      required: [pid, ppid, user, args, state, cpuTimeMillis, rssBytes, startedAt]
      properties:
        pid: {type: integer}
        ppid: {type: integer}
        user: {type: string}
        args:
          type: array
          items: {type: string}
        state: {type: string}
        cpuTimeMillis: {type: integer, format: int64}
        rssBytes: {type: integer, format: int64}
        startedAt: {type: string, format: date-time}
        processId:
          type: string
          description: Set for davit-managed processes.
    GuestProcessList:
      type: object
      required: [sampledAt, stale, truncated, items]
      properties:
        sampledAt: {type: string, format: date-time}
        stale:
          type: boolean
          description: The VM is not running; this is its last sample.
        truncated: {type: boolean}
        items:
          type: array
          items: {$ref: '#/components/schemas/GuestProcess'}

    SnapshotEntry:
      type: object
      required: [path, type, sizeBytes, mode, modifiedAt]
      properties:
        path: {type: string}
        type:
          type: string
          enum: [file, dir, symlink, other]
        sizeBytes: {type: integer, format: int64}
        mode: {type: string}
        modifiedAt: {type: string, format: date-time}
        linkTarget: {type: string}
    SnapshotTree:
      type: object
      required: [path, items]
      properties:
        path: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/SnapshotEntry'}
        nextCursor: {type: string}
