      description: |
        The guest agent listens on `127.0.0.1:guestPort` inside the VM's current
        generation; every connection a guest process makes there is bridged to
        the target fixed here. The guest never chooses the far end.

        - `session`: the caller attaches `attachReverseSession` (before
