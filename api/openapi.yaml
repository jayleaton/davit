          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createToken
      tags: [tokens]
      summary: Create a scoped, expiring API token. The secret is shown once.
      description: |
        Tokens cannot exceed the issuing principal's rights, and only the owner
        identity (local socket or tailnet WhoIs), never a token, may manage
        tokens. The secret is returned once and only its SHA-256 is stored.
        Use it as `Authorization: Bearer <secret>` on the tailnet listener,
        where a WhoIs identity is still required: the request then runs as the
        token's issuer limited to the token's scopes. Actions nest: `exec`
        implies `view`, `admin` implies both. A `vmId` scope (name or ID,
        stored as the ID) reaches only that VM's endpoints.
        An Idempotency-Key replay within 10 minutes returns the same response;
        later it is 409 `invalid_state` naming the token (the secret is not
        kept), never a second token.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTokenRequest'}
      responses:
        '201':
          description: The created token, including its one-time secret.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatedToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

