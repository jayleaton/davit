          content:
            application/json:
              schema: {$ref: '#/components/schemas/Process'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: killProcess
      tags: [processes]
      summary: Signal a process.
      description: |
        Delivers the signal to the process group. Accepted names: HUP, INT,
        QUIT, KILL, TERM, USR1, USR2, CONT, STOP, WINCH, with or without the
        `SIG` prefix.
        Naturally idempotent, so it takes no `Idempotency-Key`: signalling a
        process that already finished delivers nothing and returns 409
        `invalid_state`; the effect never happens twice.
      x-davit-implemented: true
      parameters:
        - name: signal
          in: query
          description: Signal name to deliver.
          schema:
            type: string
            default: SIGTERM
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The process after the signal was delivered.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Process'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/Internal'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/processes/{processId}/stream:
    parameters:
      - $ref: '#/components/parameters/VMId'
      - $ref: '#/components/parameters/ProcessId'
    get:
      operationId: attachProcess
      tags: [processes]
      summary: Attach to process stdio over an authenticated, bounded WebSocket.
      description: |
        Each WebSocket message is one JSON text `ProcessStreamMessage`
        (at most 1 MiB). The server sends `stdout`/`stderr` chunks with
        increasing `seq`, then one `exit` carrying the final `Process` (or
        `error`), then closes. Output replays every retained chunk with
        `seq > outputCursor`; a cursor older than retained output fails with
        an `error` message. The client may send `stdin` (only for processes
        started with `stdin: true`, and only on the first stream),
        `stdin.close` and `signal`. Stdin is never replayed after a
        reconnect.
      x-davit-implemented: true
      parameters:
        - name: outputCursor
          in: query
          description: Replay output messages with `seq` greater than this.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '101':
          description: Switching to the WebSocket stream protocol.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/files:
    parameters:
      - $ref: '#/components/parameters/VMId'
      - name: path
        in: query
        required: true
        description: Absolute guest path.
        schema:
          type: string
          pattern: '^/'
      - name: user
        in: query
        description: |
          Guest user whose permissions scope the access (the kernel checks
          them on every open/create); default the image's user.
        schema:
          type: string
      - name: generation
        in: query
        required: true
        description: |
          Expected VM `instanceGeneration`; a mismatch fails with
          `409 invalid_state` so a transfer never lands in a different boot.
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: archive
        in: query
        description: |
          `tar`: transfer a directory as a tar stream of its contents
          (regular files, directories and symlinks, not followed; permission
          bits and mtimes; owners are the scoping user). On write, the tar is
          verified first, then extracted into `path` (created if missing);
          entries that escape `path` or pass through a symlink are rejected,
          and setuid/setgid/sticky bits are dropped. Not atomic as a whole.
        schema:
          type: string
          enum: [tar]
    get:
      operationId: readFile
      tags: [files]
      summary: Read a guest file, or a directory as tar.
      description: |
        Streams the bytes. Regular files carry `Content-Length`; a transfer
        that fails after the headers is cut short (connection closed), so
        clients must check the length or the tar end marker.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: File bytes (`application/octet-stream`) or a tar stream (`application/x-tar`).
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
            X-Davit-File-Mode:
              description: Octal permission bits of the file or archive root.
              schema: {type: string}
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
            application/x-tar:
              schema:
                type: string
                contentMediaType: application/x-tar
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      operationId: writeFile
      tags: [files]
      summary: Atomically replace a guest file, or extract a tar into a directory.
      description: |
        The body streams to a guest temp file; the agent checks its size and
        SHA-256 and only then renames it over `path` (or, with
        `archive=tar`, extracts it). Bodies are bounded by 64 GiB.
        Naturally idempotent, so it takes no `Idempotency-Key`: repeating a
        write with the same bytes and mode leaves the same file.
      x-davit-implemented: true
      parameters:
        - name: mode
          in: query
          description: |
            Octal permission bits, e.g. `0644`. Files: default keeps an
            existing file's mode, else 0644. Archives: mode of a newly
            created `path` directory, default 0755.
          schema:
            type: string
            pattern: '^0?[0-7]{3,4}$'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentMediaType: application/octet-stream
          application/x-tar:
            schema:
              type: string
              contentMediaType: application/x-tar
      responses:
        '200':
          description: The written file.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileInfo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/prompts:
    parameters:
      - $ref: '#/components/parameters/VMId'
    post:
      operationId: createPrompt
      tags: [prompts]
      summary: Start one turn of a harness conversation (Claude Code, Codex, OpenCode, pi) in the VM.
      description: |
        Runs the harness CLI inside the VM through the process API (detached,
        prompt on stdin) and normalizes its JSON output into
        `PromptEvent`s; follow them with `listPromptEvents`. A conversation
        runs one turn at a time: a turn while another is active is
        `409 operation_in_progress` (retryable). The harness's native
        session is kept, so later turns resume it. Harnesses are not
        installed at prompt time: a missing binary fails the turn with
        error code `harness_missing` (image capability `harness.<name>`).
        Credentials are never copied implicitly: `env` values and named
        daemon `secrets` enter the guest as environment variables of the
        harness process, and are not stored.
        `Idempotency-Key` is required, scoped to owner and VM as for
        `execProcess`: the same key and body return the existing turn; the
        same key with a different body is `409 idempotency_conflict`.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromptRequest'}
      responses:
        '201':
          description: The accepted turn.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
