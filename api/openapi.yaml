        `hold` the run stops in `waiting` until startRun (push files first
        with pushTree). The run is created in state `creating` and advances
        in the background; poll getRun. A run is terminal (`succeeded`,
        `failed`, `cancelled`) only after its VM is deleted (unless `keep`);
        `failed` covers a non-zero exit (`exitCode`), the timeout
        (`error.code` = `timeout`) and setup failures (`error`). After the
        command exits its VM is kept for a short output grace (5s) so a
        client following `processId` with attachProcess reads all of the
        output; once `exitCode` or `error` is set, cancelRun ends the grace
        and keeps the outcome. Runs survive a daemon restart without a
        second VM or a second command.
