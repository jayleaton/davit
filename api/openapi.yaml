openapi: 3.1.0
info:
  title: Davit API
  version: 1.0.0
  summary: Self-hosted fast VMs for AI agents.
  description: |
    The davit v1 HTTP contract (docs/research/SPEC.md §4).

    - JSON request and response bodies except where a byte or WebSocket stream is defined.
    - Timestamps are UTC RFC 3339 (`format: date-time`). IDs are opaque, prefixed strings.
    - Lifecycle mutations are asynchronous: they return `202` with an `OperationAccepted`
      body and a `Location: /api/v1/operations/{operationId}` header. Poll `getOperation`
      or long-poll `listOperationEvents` for progress and the terminal result.
    - Every non-2xx response is an `ErrorResponse`. Error `code` values, not English
      messages, are the stable contract. Secrets and host paths are always redacted.
    - Enum values (in particular `VMState`) may grow in later versions. Clients MUST
      tolerate unknown values.
    - `X-Request-Id` may be supplied by the client and is always echoed on responses.

    Implementation status: every operation carries `x-davit-implemented`. Operations
    marked `false` are part of the v1 contract but currently return
    `501 not_implemented`.
servers:
  - url: 'https://{host}/api/v1'
    description: |
      Remote listener (tsnet only; never a public interface). The local unix socket
      serves the same paths under `/api/v1` and authenticates peers by OS credentials.
    variables:
      host:
        default: davit-host
security:
  - bearerToken: []
  - {}
x-davit-tailnet-required: true
tags:
  - name: capabilities
  - name: images
  - name: vms
  - name: snapshots
  - name: operations
  - name: processes
  - name: files
  - name: prompts
  - name: tunnels
  - name: ssh
  - name: tokens
  - name: events
    description: G16 host event stream (feature events).
  - name: webhooks
    description: G16 signed event deliveries (feature webhooks).
  - name: reverse-forwards
    description: G10 reverse connections (feature reverseForward).
  - name: members
    description: G13 tailnet members and shares (feature members).
  - name: desktop
    description: G15 desktop viewer over the gateway (feature desktop).
  - name: app-endpoints
    description: G11 tailnet-private app endpoints (feature appEndpoints).
  - name: environments
    description: Parity v1 contract (G3), not implemented yet.
  - name: credentials
    description: Parity v1 contract (G4), not implemented yet.
  - name: runs
    description: Parity v1 contract (G6), not implemented yet.

paths:
  /capabilities:
    get:
      operationId: getCapabilities
      tags: [capabilities]
      summary: Report what this host and runtime honestly support.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Host capability report.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HostCapabilities'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /images:
    get:
      operationId: listImages
      tags: [images]
      summary: List images available on this host.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of images.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /images/{imageId}:
    parameters:
      - $ref: '#/components/parameters/ImageId'
    get:
      operationId: getImage
      tags: [images]
      summary: Get one image.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The image.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Image'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms:
    get:
      operationId: listVMs
      tags: [vms]
      summary: List VMs owned by or visible to the caller.
      description: |
        Ordered by `(createdAt, id)`. Without `state` or `all`, lists
        `provisioning`, `ready` and `running` VMs.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          description: |
            Filter by state; repeat to select several. Defaults to
            `provisioning,ready,running`. Ignored when `all=true`.
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: '#/components/schemas/VMState'}
            default: [provisioning, ready, running]
        - name: all
          in: query
          description: Include VMs in every state, including deleted tombstones.
          schema:
            type: boolean
            default: false
        - name: label
          in: query
          description: |
            `KEY=VALUE`; repeat to require several. Only VMs carrying every
            given label are listed (e.g. `label=davit.box=myproject`).
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of VMs.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VMList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: createVM
      tags: [vms]
      summary: Create a VM from an image or a snapshot.
      description: |
        Asynchronous. `image` and `snapshotId` are mutually exclusive. Same
        `Idempotency-Key` and body returns the same operation; a different body
        returns `409 idempotency_conflict`. When admission has no room, idle VMs
        are stopped first, then `waitSeconds` queues the request (feature
        capacityReclaim; see `CapacityWait`).
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CapacityWait'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVMRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/batch:
    post:
      operationId: createVMs
      tags: [vms]
      summary: "Create up to 100 VMs from one template; one result per item."
      description: |
        Feature `batchCreate`. The template is validated once, as `createVM`
        would: an invalid template (or `count` outside 1..100) fails the whole
        request and creates nothing. Each item is then a separate `createVM`,
        idempotent on the batch `Idempotency-Key` plus `/` and its 1-based
        index, and admitted on its own (limits, host memory, VM slots, name
        conflicts): a refused item carries its `error` and the others continue.
        Every item is reported, in order. Replaying the key and body returns
        the same operations; a retry after a partial failure creates only the
        missing items; the key with a different template answers
        `idempotency_conflict` per item. A template `name` N names the items
        N-1 ... N-count; without one they are unnamed. The boots run as
        ordinary create operations.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVMsRequest'}
      responses:
        '200':
          description: Every item, accepted or refused.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateVMsResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/reclaim:
    post:
      operationId: reclaimVMs
      tags: [vms]
      summary: "Stop the caller's VMs that have been idle at least idleSeconds."
      description: |
        Feature `capacityReclaim` (`davit box gc`). Selects the caller's VMs
        that are ready with no operation, run no process, have no stream or
        tunnel open, hold no prompt-turn lease and have had no exec or tunnel
        activity for `idleSeconds`; never ephemeral or no-snapshot VMs. Unlike
        making room at admission, a VM needs no idle timeout. Each is stopped
        (`Operation.reason: gc`), oldest activity first; the answer lists them
        with their stop operations without waiting for the stops. `dryRun`
        only lists them. No Idempotency-Key: each stop is keyed by its VM's
        generation and revision, so a repeat stops nothing twice.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReclaimVMsRequest'}
      responses:
        '200':
          description: The VMs stopped (or, with dryRun, that would be).
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReclaimVMsResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}:
    parameters:
      - $ref: '#/components/parameters/VMId'
    get:
      operationId: getVM
      tags: [vms]
      summary: Get one VM (including deleted tombstones while retained).
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The VM.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VM'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteVM
      tags: [vms]
      summary: Delete a VM.
      description: |
        Asynchronous. Access closes immediately; cleanup completes before the
        operation succeeds and a bounded tombstone is retained. Reachable from
        every non-deleted state.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      operationId: updateVM
      tags: [vms]
      summary: Rename a VM, change its TTL (extend its auto-stop) or replace its egress policy.
      description: |
        Synchronous change; returns the VM. Naturally idempotent (no
        `Idempotency-Key`): repeating it sets the same name and policy and
        restarts the countdown from the time of the repeat. Supports
        `If-Match`. Deleted VMs are 404.

        `egress` takes effect immediately on a running VM (new connections
        and DNS queries; flows to destinations the new policy no longer allows
        are closed) and is kept for later boots of a stopped one. It is
        applied before it is recorded: if a running VM cannot be updated the
        call fails (503, retryable) and the previous policy stays in force.
        A request with `egress` is rejected with `409 operation_in_progress`
        while a lifecycle operation is running.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateVMRequest'}
      responses:
        '200':
          description: The updated VM.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VM'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/stop:
    parameters:
      - $ref: '#/components/parameters/VMId'
    post:
      operationId: stopVM
      tags: [vms]
      summary: Stop a VM, committing its disk.
      description: Asynchronous. Stop on an already stopped VM is a safe no-op (`result.noop`).
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StopVMRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/resume:
    parameters:
      - $ref: '#/components/parameters/VMId'
    post:
      operationId: resumeVM
      tags: [vms]
      summary: Resume a stopped or errored VM from its last committed disk.
      description: >-
        Asynchronous. Resume on a ready VM is a safe no-op (`result.noop`).
        `type` and `shape` resize the VM for this and later boots (feature
        resize): shape fields override the profile, which overrides the VM's
        current shape. CPUs and memory change within the runtime's
        constraints; the disk can only grow (a smaller `shape.diskBytes` is
        `invalid_argument` with details `field`, `currentBytes` and `reason:
        disk_shrink`; a profile's smaller disk keeps the current one). The
        grown disk is a clone of the last committed disk at the new size; the
        guest filesystem is not grown automatically. Admission checks the new
        CPUs and memory plus the disk growth. A shape change on a ready or
        running VM is refused with `stop_required`; the new shape is
        persisted when the resume is accepted. Making room and `waitSeconds`
        work as on createVM.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/CapacityWait'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResumeVMRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/recover:
    parameters:
      - $ref: '#/components/parameters/VMId'
    post:
      operationId: recoverVM
      tags: [vms]
      summary: "Power-cycle a wedged VM on its current disk."
      description: |
        Asynchronous (operation kind `recover`, feature `recover`). Kills the VM's VMM without a RAM
        or disk commit and cold boots its current working disk as is in a new instance generation:
        what the guest wrote survives crash-consistent, like a power loss; nothing rolls back and no
        snapshot is taken. Accepted for `ready`, `running` and `error` VMs that still have a working
        disk; the VM goes to `provisioning`, then `ready` with `bootMode` `cold_boot`. A `stopped` VM
        (use resumeVM) or an `error` VM without a working disk (resume from its last snapshot)
        answers `invalid_state`; a VM with an operation in progress answers
        `operation_in_progress`. An `error` VM is admitted for its CPUs and memory like resume;
        credential grants are kept.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecoverVMRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/fork:
    parameters:
      - $ref: '#/components/parameters/VMId'
    post:
      operationId: forkVM
      tags: [vms]
      summary: Create a new VM from this VM's disk (or one of its snapshots).
      description: Asynchronous. Source owner policy is enforced.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: false
        description: Optional; an empty body forks the source's last committed snapshot with its shape.
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForkVMRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnsupportedCapability'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /vms/{vmId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/VMId'
    get:
      operationId: listVMSnapshots
      tags: [snapshots]
      summary: List snapshots whose source is this VM.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of snapshots.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      operationId: snapshotVM
      tags: [snapshots]
      summary: Name the committed disk state of a stopped VM.
      description: >-
        v0 names the stopped VM's last committed disk generation; it copies no data, so the
        returned operation has already succeeded and its `result.snapshotId` is the new named
        snapshot. A ready or running VM returns 409 `stop_required` (live snapshots are later);
        other states return 409 `invalid_state`. Names are unique per owner. Named snapshots
        survive deletion of their source VM.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SnapshotVMRequest'}
      responses:
        '202': {$ref: '#/components/responses/OperationAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      summary: List snapshots visible to the caller.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of snapshots.
          headers:
            X-Request-Id: {$ref: '#/components/headers/X-Request-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SnapshotList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /snapshots/{snapshotId}:
    parameters:
      - $ref: '#/components/parameters/SnapshotId'
    get:
      operationId: getSnapshot
      tags: [snapshots]
      summary: Get one snapshot.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: The snapshot.
