        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Delete a snapshot reference.
      description: >-
        Synchronous. Removes the snapshot record; its disk data is garbage-collected only once no
        other snapshot, VM or unfinished operation references it. A snapshot that is still a VM's
        last committed disk, the only source a VM can resume from, or the source of an unfinished
        operation returns 409 `invalid_state`. Deleting is naturally idempotent in effect: a repeat
