  /operations/{operationId}/events:
    parameters:
      - $ref: '#/components/parameters/OperationId'
    get:
      operationId: listOperationEvents
      tags: [operations]
      summary: List ordered progress events after a cursor, optionally long-polling.
      description: |
        Returns events with `seq > after`, in order. With `waitMs > 0` and no
        new events, the request blocks until a new event arrives, the operation
        becomes terminal, or `waitMs` elapses (then `items` is empty). Pass
        `nextCursor` back as `after`.
      x-davit-implemented: true
      parameters:
        - name: after
          in: query
          description: Sequence cursor; return events with `seq` greater than this. 0 means from the start.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: waitMs
          in: query
          description: Long-poll budget in milliseconds.
