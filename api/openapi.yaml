      description: Active tokens only (not revoked, not expired). Secrets are never returned.
      x-davit-implemented: true
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: A page of tokens (never including secrets).
          headers:
