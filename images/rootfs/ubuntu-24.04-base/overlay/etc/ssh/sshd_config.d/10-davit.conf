# davit: key-only logins. Host keys are not configured here: the guest agent owns them and
# writes 50-davit.conf (HostKey + TrustedUserCAKeys) during the restore barrier. Until then
# sshd uses whatever davit-ssh-hostkeys.service generated on first boot.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
UseDNS no
