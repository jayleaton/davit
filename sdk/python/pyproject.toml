[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "davit-sdk"
version = "0.1.0"
description = "Python client for the davit API: self-hosted fast VMs for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Pinned to the versions in the repo-local venv (.build/py-venv).
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pyyaml==6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/davit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: runs a real davit daemon (fake runtime)"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
# Compound asserts read better in these tests.
"tests/**" = ["PT018"]

[tool.mypy]
python_version = "3.10"
strict = true
